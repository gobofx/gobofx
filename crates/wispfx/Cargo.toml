[package]
name = "wispfx"
description = "WispFX reference implementation: manifest parsing, validation, module assembly, and a headless wgpu renderer with a CLI for testing plugins."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "wispfx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
naga = { version = "25", features = ["wgsl-in"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "25", default-features = false, features = ["wgsl", "metal", "dx12", "vulkan"] }
